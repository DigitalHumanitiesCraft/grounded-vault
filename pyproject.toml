[project]
name = "grounded-vault"
version = "0"
requires-python = ">=3.11"
dependencies = ["pyyaml"]
# no [build-system]: this repo is a dependency set for the validation scripts,
# not an installable package

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["validate", "inventory", "review", "migrate", "build_docs"]
